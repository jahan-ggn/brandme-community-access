services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SHOPIFY_APP_URL: "https://${APP_DOMAIN}"

    volumes:
      - app-data:/app/data

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./502.html:/etc/caddy/errors/502.html:ro
      - caddy-data:/data
      - caddy-config:/config

  retry-worker:
    image: curlimages/curl:8.16.0
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    environment:
      RETRY_WORKER_SECRET: ${RETRY_WORKER_SECRET}
      APP_URL: http://app:3000

    entrypoint: /bin/sh

    command:
      - -c
      - |
        while true; do
          echo "$$(date -Iseconds) Running retry worker..."

          if ! curl --fail --silent --show-error \
            -X POST "$$APP_URL/api/retry" \
            -H "Authorization: Bearer $$RETRY_WORKER_SECRET"; then
            echo "$$(date -Iseconds) ERROR: Retry worker request failed" >&2
          fi

          sleep 120
        done

volumes:
  app-data:
  caddy-data:
  caddy-config:
